[project]
name = "langchain-learning-path"
version = "0.1.0"
description = "Comprehensive master learning path for LangChain v0.3 / v1.0, LCEL, RAG, and Autonomous Agent architectures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "faiss-cpu>=1.7.4",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "rich>=13.7.0",
    "pytest>=8.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
